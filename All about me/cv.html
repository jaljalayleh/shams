    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #000;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =================================
           MAIN LAYOUT
        ================================= */

        .scene {
            width: 95%;
            max-width: 1100px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 50px;
        }


        /* =================================
           GIRL
        ================================= */

        .girl {
            width: 470px;
            height: 590px;

            flex-shrink: 0;

            transition: 0.4s ease;
        }

        .girl:hover {
            transform: translateY(-8px);
        }


        .girl svg {
            width: 100%;
            height: 100%;

            overflow: visible;
        }


        /* =================================
           SPEECH SECTION
        ================================= */

        .speech-area {
            width: 390px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =================================
           SPEECH BUBBLE
        ================================= */

        .speech {
            position: relative;

            width: 370px;

            padding: 32px;

            background: #f7b6d2;

            color: #000;

            border-radius: 30px;

            text-align: center;

            font-size: 21px;

            line-height: 1.5;

            box-shadow:
                0 0 35px rgba(247, 182, 210, 0.25);

            animation: floating 3s ease-in-out infinite;
        }


        .speech::before {
            content: "";

            position: absolute;

            left: -28px;
            top: 55px;

            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-right: 32px solid #f7b6d2;
        }


        @keyframes floating {

            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }

            100% {
                transform: translateY(0);
            }
        }


        .hello {
            color: #c2185b;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 10px;

            text-transform: uppercase;
        }


        /* =================================
           CV BUTTON
        ================================= */

        .cv-button {
            display: inline-block;

            margin-top: 25px;

            padding: 15px 38px;

            background: #000;

            color: #f7b6d2;

            text-decoration: none;

            border-radius: 50px;

            font-size: 18px;

            font-weight: bold;

            transition: 0.3s ease;
        }


        .cv-button:hover {
            background: #c2185b;

            color: white;

            transform: scale(1.08);
        }


        .note {
            margin-top: 15px;

            color: #777;

            font-size: 12px;
        }


        /* =================================
           BACK BUTTON
        ================================= */

        .back {
            position: fixed;

            bottom: 25px;
            left: 25px;

            padding: 12px 25px;

            background: #f7b6d2;

            color: #000;

            text-decoration: none;

            border-radius: 50px;

            font-weight: bold;

            transition: 0.3s;
        }


        .back:hover {
            background: #c2185b;

            color: white;

            transform: scale(1.05);
        }


        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 850px) {

            body {
                overflow-y: auto;

                padding: 30px 0;
            }

            .scene {
                flex-direction: column;

                gap: 5px;
            }

            .girl {
                width: 360px;
                height: 450px;
            }

            .speech-area {
                width: 90%;
            }

            .speech {
                width: 100%;

                font-size: 18px;
            }

            .speech::before {
                display: none;
            }
        }

    </style>
</head>
